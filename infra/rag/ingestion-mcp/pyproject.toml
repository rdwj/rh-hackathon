[project]
name = "ingestion-mcp"
version = "0.1.0"
description = "MCP server for document ingestion into the Griot & Grits RAG pipeline"
requires-python = ">=3.11"
authors = [{name = "Griot & Grits Team"}]
readme = "README.md"
dependencies = [
  "fastmcp>=2.11.3",
  "pyyaml>=6.0.2",
  "python-dotenv>=1.1.1",
  "watchdog>=6.0.0",
  "pyjwt>=2.10.1",
  "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project.scripts]
ingestion-mcp = "src.main:main"

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
