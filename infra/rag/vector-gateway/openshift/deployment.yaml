# Vector Gateway Deployment for OpenShift
# Provides REST API for vector operations backed by Milvus
# Uses Nomic embed-text-v1.5 for embeddings (768-dimensional vectors)
#
# Prerequisites:
#   1. Milvus deployed in the namespace
#
#   2. Create the secret with your API key BEFORE deploying:
#      oc create secret generic vector-gateway-secrets \
#        --from-literal=NOMIC_API_KEY="your-actual-api-key" \
#        -n <namespace>
#
#   3. Or update existing secret:
#      oc create secret generic vector-gateway-secrets \
#        --from-literal=NOMIC_API_KEY="your-actual-api-key" \
#        -n <namespace> --dry-run=client -o yaml | oc apply -f -
#
# Deploy:
#   oc apply -f openshift/deployment.yaml -n <namespace>
#
# NOTE: The Secret below is a TEMPLATE with placeholder values.
#       You MUST create/update the secret with real values before the service will work.
---
apiVersion: v1
kind: Secret
metadata:
  name: vector-gateway-secrets
  labels:
    app: vector-gateway
    app.kubernetes.io/name: vector-gateway
    app.kubernetes.io/part-of: griot
  annotations:
    description: "TEMPLATE - Replace NOMIC_API_KEY with actual value before deploying"
type: Opaque
stringData:
  # IMPORTANT: Replace this placeholder with your actual API key
  # See header comments for instructions
  NOMIC_API_KEY: "REPLACE_WITH_ACTUAL_API_KEY"
  # Milvus authentication (if needed)
  # MILVUS_USER: ""
  # MILVUS_PASSWORD: ""
  # Optional: auth token for vector-gateway API
  # AUTH_TOKEN: "your-secret-token"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vector-gateway-config
  labels:
    app: vector-gateway
    app.kubernetes.io/name: vector-gateway
    app.kubernetes.io/part-of: griot
data:
  # Backend configuration
  GATEWAY_BACKEND: "milvus"
  GATEWAY_REQUIRE_BACKEND: "1"
  GATEWAY_MAX_DOCS: "100000"

  # Milvus connection (internal cluster DNS)
  # Update MILVUS_HOST to match your Milvus service name
  MILVUS_HOST: "milvus.griot.svc.cluster.local"
  MILVUS_PORT: "19530"
  MILVUS_COLLECTION: "griot"
  MILVUS_DIM: "768"

  # Nomic embedding settings (MaaS - OpenAI-compatible API)
  NOMIC_API_URL: "https://nomic-embed-text-v1-5-maas-apicast-production.apps.prod.rhoai.rh-aiservices-bu.com:443/v1"
  NOMIC_MODEL: "/mnt/models"

  # Optional: Use rerank service if deployed
  # RERANK_SERVICE_URL: "http://rerank-service.griot.svc.cluster.local:8000"
---
apiVersion: v1
kind: Service
metadata:
  name: vector-gateway
  labels:
    app: vector-gateway
    app.kubernetes.io/name: vector-gateway
    app.kubernetes.io/part-of: griot
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
  selector:
    app: vector-gateway
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: vector-gateway
  labels:
    app: vector-gateway
    app.kubernetes.io/name: vector-gateway
    app.kubernetes.io/part-of: griot
  annotations:
    haproxy.router.openshift.io/timeout: 120s
spec:
  to:
    kind: Service
    name: vector-gateway
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vector-gateway
  labels:
    app: vector-gateway
    app.kubernetes.io/name: vector-gateway
    app.kubernetes.io/part-of: griot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vector-gateway
  template:
    metadata:
      labels:
        app: vector-gateway
        app.kubernetes.io/name: vector-gateway
        app.kubernetes.io/part-of: griot
    spec:
      containers:
        - name: vector-gateway
          # Use OpenShift internal registry or Quay
          # Update to your actual image location
          image: image-registry.openshift-image-registry.svc:5000/griot/vector-gateway:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: vector-gateway-config
            - secretRef:
                name: vector-gateway-secrets
          resources:
            requests:
              cpu: "100m"
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
      restartPolicy: Always
